<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef5ff;
        }

        .form-box {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .gender {
            width: auto;
        }

        .terms {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Student Registration</h2>

    <form onsubmit="return validateForm()">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter 10 digit mobile number">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="CSE">Computer Science</option>
            <option value="ECE">Electronics Engineering</option>
        </select>

        <label>Year</label>
        <select id="year">
            <option value="">Select Year</option>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>
        </select>

        <label>Gender</label>
        <input class="gender" type="radio" name="gender" value="Male"> Male
        <input class="gender" type="radio" name="gender" value="Female"> Female
        <input class="gender" type="radio" name="gender" value="Other"> Other

        <label>
            <input class="terms" type="checkbox" id="terms">
            I accept the Terms and Conditions
        </label>

        <button type="submit">Register</button>

        <p id="msg"></p>

    </form>
</div>

<script>

function validateForm() {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let course = document.getElementById("course").value;
    let year = document.getElementById("year").value;
    let terms = document.getElementById("terms").checked;
    let gender = document.querySelector('input[name="gender"]:checked');

    // Regular Expressions
    let namePattern = /^[A-Za-z ]{3,30}$/;
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let mobilePattern = /^[6-9][0-9]{9}$/;
    let passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if (!namePattern.test(name)) {
        alert("Enter a valid name.");
        return false;
    }

    if (!emailPattern.test(email)) {
        alert("Enter a valid email address.");
        return false;
    }

    if (!mobilePattern.test(mobile)) {
        alert("Enter a valid 10 digit mobile number.");
        return false;
    }

    if (!passwordPattern.test(password)) {
        alert("Password must be at least 8 characters and contain a letter, number and special character.");
        return false;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return false;
    }

    if (course === "") {
        alert("Please select a course.");
        return false;
    }

    if (year === "") {
        alert("Please select your year.");
        return false;
    }

    if (!gender) {
        alert("Please select your gender.");
        return false;
    }

    if (!terms) {
        alert("Please accept the Terms and Conditions.");
        return false;
    }

    document.getElementById("msg").innerHTML =
        "Registration Successful!";

    return false;
}

</script>

</body>
</html>
